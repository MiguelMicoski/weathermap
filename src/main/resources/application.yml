server:
  port: ${SERVER_PORT:7171}

spring:
  application:
    name: weathermap
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost/weathermap}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret}

weather:
  api:
    base-url: ${WEATHER_API_BASE_URL:https://api.weatherapi.com/v1}
    key: ${WEATHER_API_KEY:}
